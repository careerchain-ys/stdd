レビュー前に必ず以下を読む:

- `AGENTS.md / CLAUDE.md` の規約（存在する場合のみ）
- `.claude/docs/coding-conventions.md`（存在する場合のみ）
- 対象 issue / 前方設計インプットの内容
- common 階層の REQUIREMENTS.md（feature レビュー時、整合確認のため）
